<div class="list" [ngClass]="{ list_padding: isModal }">
  @if (showEmptyPrivateList) {
    <div class="empty-list">
      <div class="empty-list__content">
        <app-no-result
          label="No private providers for these pair"
          description="Please try another token combination."
        ></app-no-result>
      </div>
    </div>
  }

  @for (state of states; track state.tradeType) {
    <app-provider-element
      [isBest]="isBestProvider(state)"
      [tradeState]="state"
      [shortedInfo]="shortedInfo"
      [selectedTradeType]="selectedTradeType"
      [privateOnly]="privateOnly"
      (click)="handleTradeSelection($event, state.tradeType, state.trade, state.error)"
      [hideHint$]="hideHint$"
    ></app-provider-element>
  }
</div>
