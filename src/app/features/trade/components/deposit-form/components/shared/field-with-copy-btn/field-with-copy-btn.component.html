<div
  class="field-with-copy-btn"
  [style.background-color]="bgColor"
  [style.border-color]="borderColor"
  [style.padding]="padding && padding"
  [tuiHint]="tooltip"
  (click)="copyToClipboard()"
>
  <b
    class="field-with-copy-btn__text"
    [style.color]="textColor"
    [style.font-size]="fontSize && fontSize"
    [style.font-weight]="fontWeight && fontWeight"
    >{{ visibleText }}
  </b>
  <span
    class="field-with-copy-btn__copy-btn"
    [inlineSVG]="'assets/images/swaps/swaps-info/copy-icon.svg'"
    [class.field-with-copy-btn__copy-btn-copied]="copied"
    [ngClass]="{ 'copy-btn-size-s': iconSize === 's', 'copy-btn-size-m': iconSize === 'm' }"
  ></span>
</div>

<ng-template #tooltip>
  <span class="hint">{{ textToCopy }}</span>
</ng-template>
