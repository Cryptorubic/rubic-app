<div class="view-reward">
  @if (title) {
    <div class="view-reward__title">{{ title }}</div>
  }

  @if (description) {
    <div class="view-reward__description" [innerHTML]="description"></div>
  }

  <div class="view-reward__input-container">
    @if (inputLabel) {
      <div class="view-reward__input-label">{{ inputLabel }}</div>
    }

    @if (activationCode || userInput) {
      <div class="view-reward__activation-code">
        {{ activationCode || userInput }}
      </div>
    } @else if (activationLink) {
      <div class="view-reward__activation-link">
        {{ shortenedActivationLink }}
        <span class="view-reward__activation-link-subtext">Tx hash</span>
      </div>

      <a
        [href]="activationLink"
        target="_blank"
        rel="noopener noreferrer"
        class="view-reward__activation-link-explorer"
      >
        View transaction in explorer
        <div [inlineSVG]="'assets/images/icons/link-arrow.svg'"></div>
      </a>
    }
  </div>

  @if (link) {
    <div class="view-reward__link" [innerHTML]="link"></div>
  }

  @if (note) {
    <div class="view-reward__note">{{ note }}</div>
  }
</div>
