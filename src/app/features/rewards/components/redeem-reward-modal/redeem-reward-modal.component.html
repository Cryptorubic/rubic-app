<div class="redeem-reward">
  <div class="redeem-reward__header">Redeem this reward?</div>

  <div class="redeem-reward__title">
    <b>{{ title }}</b> for <b>{{ price }} Points</b>
  </div>
  <div class="redeem-reward__description">
    Your gift code and activation instructions will be available in My Collection within 24 hours.
    You can only redeem the gift code if your account has no active subscription.
  </div>

  <label class="redeem-reward__confirm">
    <input tuiCheckbox type="checkbox" [formControl]="accepted" />
    <span>I understand that this reward can't be returned for points.</span>
  </label>

  <button
    tuiButton
    appearance="primary"
    type="button"
    size="m"
    [disabled]="!canRedeem()"
    (click)="redeem()"
  >
    Redeem reward
  </button>
</div>
