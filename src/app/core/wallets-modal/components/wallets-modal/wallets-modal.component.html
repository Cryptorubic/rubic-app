<app-window-container class="modal">
  <ng-container header *ngIf="!isMobile">
    {{ 'modals.walletsModal.title' | translate }}
  </ng-container>
  <section
    *ngIf="oathConnection.view$ | async as connection; else walletList"
    class="oath-connection"
    aria-label="Connect Oath Wallet"
  >
    <h3>Connect Oath Wallet</h3>
    <p>
      Scan this QR code with Oath on your iPhone, then review the connection request in the app.
    </p>
    <img
      *ngIf="connection.qrImage; else connecting"
      [src]="connection.qrImage"
      width="280"
      height="280"
      alt="WalletConnect QR code for Oath Wallet"
    />
    <ng-template #connecting><p role="status">Preparing your connection…</p></ng-template>
    <button
      *ngIf="isIos && connection.appLink"
      tuiButton
      type="button"
      appearance="primary"
      (click)="openOath(connection.appLink)"
    >
      Open Oath Wallet
    </button>
    <p>
      <a [href]="oathAppStore" target="_blank" rel="noopener noreferrer">Get Oath for iPhone</a>
    </p>
    <button tuiButton type="button" appearance="secondary" (click)="oathConnection.cancel()">
      Cancel
    </button>
  </section>
  <ng-template #walletList>
    <form class="modal__form">
      <input tuiCheckbox type="checkbox" [formControl]="rulesCheckbox" class="modal__checkbox" />
      <span
        >I read and accept
        <a class="modal__link" href="https://rubic.exchange/pdf/terms-of-use.pdf" target="_blank">
          Terms of Use
        </a>
        and
        <a class="modal__link" href="https://rubic.exchange/pdf/privacy-policy.pdf" target="_blank">
          Privacy Policy.
        </a></span
      >
    </form>
    <main
      [className]="modalDirection === 'column' ? 'modal__body-column' : 'modal__body-row'"
      *ngLet="enableWallets$ | async as enableWallets"
    >
      <ng-container *ngFor="let provider of providers">
        <ng-container *ngIf="provider.display">
          <div class="modal__provider" [ngClass]="{ disabled: !enableWallets }">
            <button
              tuiButton
              appearance="secondary"
              type="button"
              size="l"
              *ngIf="!(provider.value | functionCall: shouldRenderAsLink); else deepLink"
              [disabled]="(walletsLoading$ | async) || provider.disabled || !enableWallets"
              (click)="connectProvider(provider.value)"
              class="modal__button"
            >
              <span class="modal__provider-icon">
                <img src="{{ provider.img }}" alt="{{ provider.name }} provider" />
              </span>
            </button>
            <ng-template #deepLink>
              <a
                tuiButton
                appearance="secondary"
                type="button"
                size="xl"
                [href]="coinbaseDeeplink"
                class="modal__button"
              >
                <span class="modal__provider-icon"
                  ><img src="{{ provider.img }}" alt="{{ provider.name }} provider"
                /></span>
              </a>
            </ng-template>
            <span class="modal__provider-name">{{ provider.name }}</span>
          </div>
        </ng-container>
      </ng-container>
    </main>
  </ng-template>
</app-window-container>
