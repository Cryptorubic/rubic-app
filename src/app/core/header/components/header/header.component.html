<app-banners *ngIf="!hideUnusedUI && !isMobile"></app-banners>

<header
  class="rubic-header"
  [ngClass]="{ 'large-iframe-header': useLargeIframe }"
  *ngLet="currentUser$ | async as currentUser"
>
  <div class="rubic-header__left">
    <app-logo
      *ngIf="!hideLogo"
      [currentUser]="!!currentUser"
      [isDarkTheme]="isDarkTheme$ | async"
      [noFrameLink]="noFrameLink"
    ></app-logo>

    <app-rubic-menu-toggler class="rubic-header__menu" *ngIf="!useLargeIframe" #menuToggler>
      <app-rubic-menu
        [swapActive]="rootPath && (swapType$ | async) === SWAP_PROVIDER_TYPE.INSTANT_TRADE"
        [crossChainActive]="
          rootPath && (swapType$ | async) === SWAP_PROVIDER_TYPE.CROSS_CHAIN_ROUTING
        "
        (swapClick)="navigateToSwaps()"
        (onClose)="menuToggler.closeMenu()"
      ></app-rubic-menu>
    </app-rubic-menu-toggler>

    @if (!useLargeIframe) {
      <button
        class="rewards-button"
        routerLink="/rewards"
        routerLinkActive="active-router-link"
        [routerLinkActiveOptions]="ROUTER_LINK_OPTS"
        tuiButton
        appearance="secondary"
        type="button"
        size="m"
      >
        Rewards
      </button>
    }
  </div>

  <div class="rubic-header__right">
    <app-language-selector *ngIf="!useLargeIframe"></app-language-selector>

    <app-history-button *ngIf="!useLargeIframe"></app-history-button>

    @if (showMyCollection$ | async) {
      <button
        routerLink="/rewards/my-collection"
        routerLinkActive="active-router-link"
        [routerLinkActiveOptions]="ROUTER_LINK_OPTS"
        class="rewards-button"
        tuiButton
        appearance="secondary"
        type="button"
        size="m"
      >
        My Collection
      </button>
    }

    <div class="rubic-header__profile">
      <ng-container *ngIf="!currentUser?.address; else loggedIn">
        <app-login-button
          class="rubic-header__login"
          [buttonHierarchy]="'header'"
        ></app-login-button>
      </ng-container>
      <ng-template #loggedIn>
        <app-user-profile class="rubic-header__profile-user"></app-user-profile>
      </ng-template>
    </div>
  </div>

  <!-- Uncomment when light theme ready -->
  <!--  <button-->
  <!--    class="theme-switcher"-->
  <!--    tuiIconButton-->
  <!--    appearance="secondary"-->
  <!--    type="button"-->
  <!--    size="m"-->
  <!--    (click)="switchTheme()"-->
  <!--  >-->
  <!--    <div-->
  <!--      class="image"-->
  <!--      [inlineSVG]="-->
  <!--        (isDarkTheme$ | async) ? '/assets/images/icons/day.svg' : '/assets/images/icons/night.svg'-->
  <!--      "-->
  <!--    ></div>-->
  <!--  </button>-->

  <ng-container *noFrame>
    <app-mobile-menu *ngIf="isMobile"></app-mobile-menu>
  </ng-container>
</header>
