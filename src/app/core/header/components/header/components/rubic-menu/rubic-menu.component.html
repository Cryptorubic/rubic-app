<div class="rubic-menu__container">
  <ng-container *ngIf="isMobile; then mobileMenu; else desktopMenu"></ng-container>

  <ng-template #desktopMenu>
    <tui-data-list class="data-list" size="m" role="menu" [emptyContent]="empty">
      <tui-opt-group>
        <ng-container *ngFor="let item of navigationList">
          @if (item.type === 'internal') {
            <button
              tuiButton
              appearance="secondary"
              type="button"
              size="m"
              class="data-list__element"
              (click)="handleButtonClick(item)"
            >
              <div class="data-list__element-container">
                @if (item.imagePath) {
                  <div class="image" [inlineSVG]="item.imagePath"></div>
                }
                {{ item.translateKey | translate }}
              </div>
            </button>
          } @else {
            <a
              tuiButton
              appearance="secondary"
              class="data-list__element"
              type="button"
              size="m"
              [href]="item.getLink()"
              target="_blank"
              (click)="handleExternalClick(item)"
            >
              <div class="data-list__element-container">
                @if (item.imagePath) {
                  <div class="image" [inlineSVG]="item.imagePath"></div>
                }
                {{ item.translateKey | translate }}
              </div>
            </a>
          }
        </ng-container>
      </tui-opt-group>
    </tui-data-list>
  </ng-template>

  <ng-template #mobileMenu>
    <tui-accordion [closeOthers]="false" [rounded]="false">
      <tui-accordion-item
        *ngFor="let section of mobileNavigationList | keyvalue: keepOriginalOrder; index as i"
        [open]="i === 0 && section.value.children.length > 0"
        [showArrow]="section.value.children.length > 0"
        (click)="section.value.onClick?.(sectionServices)"
      >
        <div class="data-list__title">{{ section.key }}</div>

        <ng-template tuiAccordionItemContent>
          <ng-container *ngFor="let menu of section.value.children">
            <div class="data-list__option-container">
              <ng-container
                *ngIf="menu.type === 'internal'; then internal; else external"
              ></ng-container>
            </div>

            <ng-template #external>
              <a
                tuiButton
                appearance="secondary"
                type="button"
                size="m"
                [href]="menu.getLink()"
                [target]="menu.target || '_blank'"
                rel="noopener noreferrer"
                (click)="handleExternalClick(menu)"
              >
                <button class="data-list__option">
                  {{ menu.translateKey | translate }}
                </button>
              </a>
            </ng-template>

            <ng-template #internal>
              <a
                tuiButton
                appearance="secondary"
                type="button"
                size="m"
                (click)="mobileClose(menu)"
                [routerLink]="menu.getLink()"
                routerLinkActive="data-list__element_active"
              >
                <button class="data-list__option">
                  {{ menu.translateKey | translate }}
                </button>
              </a>
            </ng-template>
          </ng-container>
        </ng-template>
      </tui-accordion-item>
    </tui-accordion>
  </ng-template>
  <ng-template #empty></ng-template>
</div>
