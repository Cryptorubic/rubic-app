@let isMobile = isMobile$ | async;
@let profileText = profileText$ | async;
@let img = avatar$ | async;
@let user = currentUser$ | async;
@let unreadTrades = unreadTrades$ | async;

<ng-container>
  <div [tuiDropdown]="dropdown" tuiDropdownAlign="right" [(tuiDropdownOpen)]="dropdownIsOpened">
    <div tuiGroup>
      <button tuiButton class="profile-button" appearance="secondary" type="button" size="m">
        @if (isMobile && unreadTrades > 0 && user) {
          <app-notification-badge size="xs" [value]="unreadTrades"></app-notification-badge>
        }

        <div class="user-profile__avatar">
          <img [src]="img" alt="User avatar" width="24" height="24" />
        </div>

        <div class="user-profile__text">
          {{ profileText.length > 20 ? (profileText | shortAddress: 5 : 3) : profileText }}
        </div>

        <div class="arrow" inlineSVG="assets/images/icons/arrow-down.svg"></div>
      </button>
    </div>
  </div>

  <ng-template #dropdown>
    <tui-data-list class="data-list" size="m" role="menu">
      <tui-opt-group>
        @if (isMobile) {
          <button
            tuiButton
            class="data-list__element"
            appearance="secondary"
            type="button"
            size="m"
            (click)="navigateToHistory()"
          >
            <div class="data-list__link-container">
              {{ 'navigation.recentTrades' | translate }}
            </div>
          </button>
        }

        <button
          tuiButton
          class="data-list__element"
          appearance="secondary"
          type="button"
          size="m"
          (click)="logout()"
        >
          <div class="data-list__link-container">
            {{ 'navigation.logout' | translate }}
          </div>
        </button>
      </tui-opt-group>
    </tui-data-list>
  </ng-template>
</ng-container>
