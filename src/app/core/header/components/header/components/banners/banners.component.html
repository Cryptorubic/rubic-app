@let mobile = mobile$ | async;
@let banners = banners$ | async;

<ng-container>
  <tui-carousel [duration]="banners.length > 1 ? 15000 : 0" [draggable]="false">
    @for (banner of banners; track idx; let idx = $index) {
      @let privacyBanner = isPrivacyBanner(banner);
      @if (!mobile || !privacyBanner) {
        <ng-container *tuiItem>
          <a
            (click)="clickOnBanner(banner, mobile)"
            class="banner"
            [ngStyle]="{
              'background-image':
                'url(' + (mobile ? banner.imageUrlMobile : banner.imageUrlDesktop) + ')'
            }"
            [safetyLink]="banner.linkUrl"
            [target]="privacyBanner ? '_self' : '_blank'"
          >
            <div
              class="banner__container"
              [innerHTML]="getBannerText(banner, mobile) | safeSanitizer"
            ></div>
            <button
              class="banner__button"
              [innerHTML]="getButtonText(banner) | safeSanitizer"
            ></button>
          </a>
        </ng-container>
      }
    }
  </tui-carousel>
</ng-container>
